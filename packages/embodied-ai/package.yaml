apiVersion: demo-package/v1
kind: Package
metadata:
  name: embodied-ai
  demo: embodied-ai
  version: "0.1.0"
  description: Embodied AI — ManiSkill robot simulation; RTX 3090 required for full GPU rendering.
spec:
  status: candidate
  tier: 3
  gpu:
    required: true
    minVRAMGB: 16
    recommendedVRAMGB: 24
  inference:
    defaultBackend: ollama
    ollama:
      rtx3090Model: "mistral-small3.1:24b-instruct-2503-q4_K_M"
      rtx5060tiModel: "mistral-nemo:12b-instruct-2407-q4_K_M"
      cpuModel: "mistral:7b-instruct-q4_K_M"
    vllm:
      model: "mistralai/Mistral-Small-3.1-24B-Instruct-2503"
      cpuOffloadGB: 8
      gpuMemoryUtilization: 0.80
      quantization: "awq"
      maxModelLen: 32768
      dtype: bfloat16
    api:
      provider: mistral
      model: "mistral-small-latest"
      baseUrl: "https://api.mistral.ai/v1"
      keySecret: "MISTRAL_API_KEY"
  ports: [8080, 7860]
  diskGB: 50
  volumeGB: 20
  runpod:
    gpuTypes: ["NVIDIA RTX 3090", "NVIDIA A100 80GB PCIe"]
    containerDiskGB: 50
    volumeGB: 20
    httpPorts: "8080,7860"
    tcpPorts: ""
  vastai:
    gpuModel: "RTX_3090"
    diskGB: 50
    inetUpMbps: 200
    inetDownMbps: 500
