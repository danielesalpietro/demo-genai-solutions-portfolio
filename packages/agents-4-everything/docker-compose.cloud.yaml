# Cloud override for agents-4-everything
# Merges with demos/agents-4-everything/compose.yaml via: docker compose -f demos/agents-4-everything/compose.yaml -f packages/agents-4-everything/docker-compose.cloud.yaml up -d
# Sets cloud-appropriate env defaults; bind-mounts /workspace for persistence.
services:
  ollama:
    environment:
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_FLASH_ATTENTION: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - /workspace/ollama:/root/.ollama
  app:
    volumes:
      - /workspace/data:/app/data
  vllm:
    image: vllm/vllm-openai:latest
    profiles: [vllm]
    command: >
      --model ${VLLM_MODEL:-mistralai/Mistral-Small-3.1-24B-Instruct-2503}
      --cpu-offload-gb ${VLLM_CPU_OFFLOAD_GB:-8}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.80}
      --quantization ${VLLM_QUANTIZATION:-awq}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-32768}
      --dtype ${VLLM_DTYPE:-bfloat16}
      --served-model-name local-model
    ports:
      - "11434:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - /workspace/vllm-models:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}