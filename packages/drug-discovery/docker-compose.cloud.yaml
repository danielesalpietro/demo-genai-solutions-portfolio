# Cloud override for drug-discovery
# Merges with demos/drug-discovery/compose.yaml via: docker compose -f demos/drug-discovery/compose.yaml -f packages/drug-discovery/docker-compose.cloud.yaml up -d
# Sets cloud-appropriate env defaults; bind-mounts /workspace/data for persistence.
services:
  app:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - /workspace/data:/app/data