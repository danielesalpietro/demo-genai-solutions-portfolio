apiVersion: demo-package/v1
kind: Package
metadata:
  name: private-rag
  demo: private-rag
  version: "0.1.0"
  description: Private RAG — Open WebUI + Ollama + Qdrant; fully offline after initial pull.
spec:
  status: candidate
  tier: 1
  gpu:
    required: false
    minVRAMGB: 8
    recommendedVRAMGB: 16
  inference:
    defaultBackend: ollama
    ollama:
      rtx3090Model: "mistral-small3.1:24b-instruct-2503-q4_K_M"
      rtx5060tiModel: "mistral-nemo:12b-instruct-2407-q4_K_M"
      cpuModel: "mistral:7b-instruct-q4_K_M"
    vllm:
      model: "mistralai/Mistral-Small-3.1-24B-Instruct-2503"
      cpuOffloadGB: 8
      gpuMemoryUtilization: 0.80
      quantization: "awq"
      maxModelLen: 32768
      dtype: bfloat16
    api:
      provider: mistral
      model: "mistral-small-latest"
      baseUrl: "https://api.mistral.ai/v1"
      keySecret: "MISTRAL_API_KEY"
  ports: [3000, 11434, 6333, 6334]
  diskGB: 50
  volumeGB: 30
  runpod:
    gpuTypes: ["NVIDIA RTX 3090", "NVIDIA RTX 5060 Ti", "NVIDIA A100 80GB PCIe"]
    containerDiskGB: 50
    volumeGB: 30
    httpPorts: "3000"
    tcpPorts: "11434,6333,6334"
  vastai:
    gpuModel: "RTX_3090"
    diskGB: 50
    inetUpMbps: 200
    inetDownMbps: 500
