name: Bug report
about: Report a reproducible defect
labels: ["bug", "triage"]
body:
  - type: input
    id: demo
    attributes: {label: Affected demo or component}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior and sanitized logs}
    validations: {required: true}
  - type: input
    id: environment
    attributes: {label: Environment, description: OS, Docker, and Compose versions}
    validations: {required: true}
