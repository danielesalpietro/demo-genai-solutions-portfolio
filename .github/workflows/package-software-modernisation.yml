name: Package · software-modernisation

on:
  workflow_dispatch:
    inputs:
      action:
        description: "validate | build | deploy-runpod | deploy-vastai"
        required: false
        default: validate
        type: choice
        options: [validate, build, deploy-runpod, deploy-vastai]
      gpu:
        description: GPU tier
        required: false
        default: rtx5060ti
        type: choice
        options: [cpu, rtx5060ti, rtx3090]
      tag:
        description: Docker image tag
        required: false
        default: latest
        type: string
  push:
    paths:
      - "demos/software-modernisation/**"
      - "packages/software-modernisation/**"
    branches: [develop]

jobs:
  package:
    uses: ./.github/workflows/_package-build.yml
    with:
      demo: software-modernisation
      action: ${{ inputs.action || 'validate' }}
      gpu: ${{ inputs.gpu || 'rtx5060ti' }}
      tag: ${{ inputs.tag || 'latest' }}
    secrets: inherit
