name: Package · talk-to-data

on:
  workflow_dispatch:
    inputs:
      action:
        description: "validate | build | deploy-runpod | deploy-vastai"
        required: false
        default: validate
        type: choice
        options: [validate, build, deploy-runpod, deploy-vastai]
      gpu:
        description: GPU tier
        required: false
        default: rtx5060ti
        type: choice
        options: [cpu, rtx5060ti, rtx3090]
      tag:
        description: Docker image tag
        required: false
        default: latest
        type: string
  push:
    paths:
      - "demos/talk-to-data/**"
      - "packages/talk-to-data/**"
    branches: [develop]

permissions:
  contents: read
  packages: write

jobs:
  package:
    uses: ./.github/workflows/_package-build.yml
    with:
      demo: talk-to-data
      action: ${{ inputs.action || 'validate' }}
      gpu: ${{ inputs.gpu || 'rtx5060ti' }}
      tag: ${{ inputs.tag || 'latest' }}
    secrets: inherit
