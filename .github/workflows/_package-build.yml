name: Package Build (reusable)
# Reusable workflow: validate, build+push to GHCR, deploy to RunPod or Vast.ai,
# or run automated cloud tests with artifact retrieval.
# Called from per-demo package-<demo>.yml workflows.

on:
  workflow_call:
    inputs:
      demo:
        required: true
        type: string
        description: Demo name (must match packages/<demo>/)
      action:
        required: false
        type: string
        default: validate
        description: "validate | build | deploy-runpod | deploy-vastai | cloud-test"
      gpu:
        required: false
        type: string
        default: rtx5060ti
        description: "rtx3090 | rtx5060ti | cpu"
      platform:
        required: false
        type: string
        default: runpod
        description: "runpod | vastai  (used with cloud-test action)"
      tag:
        required: false
        type: string
        default: latest
        description: Docker image tag
    secrets:
      GHCR_TOKEN:
        required: false
      RUNPOD_API_KEY:
        required: false
      VAST_AI_API_KEY:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate package.yaml
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install check-jsonschema
        run: pip install check-jsonschema==0.29.3
      - name: Validate package manifest
        run: |
          check-jsonschema \
            --schemafile schemas/package.schema.json \
            packages/${{ inputs.demo }}/package.yaml

  build:
    name: Build and push image
    needs: validate
    if: ${{ inputs.action == 'build' || inputs.action == 'deploy-runpod' || inputs.action == 'deploy-vastai' }}
    runs-on: ubuntu-22.04
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbea8a986b4e2d4b5571d5e3f902 # v5.6.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/demo-genai-solutions-portfolio/${{ inputs.demo }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,prefix=${{ inputs.demo }}-
      - name: Check for Dockerfile
        id: dockerfile_check
        run: |
          if [[ -f "packages/${{ inputs.demo }}/Dockerfile" ]]; then
            echo "path=packages/${{ inputs.demo }}/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [[ -f "demos/${{ inputs.demo }}/Dockerfile" ]]; then
            echo "path=demos/${{ inputs.demo }}/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        if: steps.dockerfile_check.outputs.found == 'true'
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b786 # v6.11.0
        with:
          context: .
          file: ${{ steps.dockerfile_check.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Skip build (no Dockerfile)
        if: steps.dockerfile_check.outputs.found == 'false'
        run: echo "No Dockerfile for ${{ inputs.demo }}; package uses upstream images. Skipping build."

  deploy-runpod:
    name: Deploy to RunPod
    needs: build
    if: ${{ inputs.action == 'deploy-runpod' }}
    runs-on: ubuntu-22.04
    environment: cloud-gpu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Deploy
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: ./scripts/deploy-runpod.sh "${{ inputs.demo }}" "${{ inputs.gpu }}"

  deploy-vastai:
    name: Deploy to Vast.ai
    needs: build
    if: ${{ inputs.action == 'deploy-vastai' }}
    runs-on: ubuntu-22.04
    environment: cloud-gpu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Deploy
        env:
          VAST_AI_API_KEY: ${{ secrets.VAST_AI_API_KEY }}
        run: ./scripts/deploy-vastai.sh "${{ inputs.demo }}" "${{ inputs.gpu }}"

  cloud-test:
    name: Cloud test on ${{ inputs.platform }} (${{ inputs.gpu }})
    needs: validate
    if: ${{ inputs.action == 'cloud-test' }}
    uses: ./.github/workflows/test-cloud.yml
    with:
      demo: ${{ inputs.demo }}
      platform: ${{ inputs.platform }}
      gpu: ${{ inputs.gpu }}
    secrets: inherit
